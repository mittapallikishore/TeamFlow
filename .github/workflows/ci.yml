name: TeamFlow Repository Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required repository files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/SETUP.md
          test -f docs/GIT_WORKFLOW.md
          test -f backend/README.md
          test -f frontend/README.md
          test -f backend/.env.example
          test -f frontend/.env.example
          test -f .gitignore

      - name: Verify environment templates are tracked
        run: |
          git ls-files --error-unmatch backend/.env.example
          git ls-files --error-unmatch frontend/.env.example

      - name: Prevent committed environment secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "ERROR: A real environment file is tracked."
            exit 1
          fi
          echo "Environment file check passed."

      - name: Repository validation passed
        run: echo "TeamFlow repository checks passed!"
